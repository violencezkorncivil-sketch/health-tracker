<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12211c"/>
      <stop offset="0.55" stop-color="#0e1a18"/>
      <stop offset="1" stop-color="#0a1412"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7a8"/><stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feComponentTransfer in="b" result="bd"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode in="bd"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#sheen)"/>

  <g transform="rotate(-90 256 256) translate(256 256) scale(0.86) translate(-256 -256)" fill="none" stroke-linecap="round">
    <!-- รางของแต่ละวง -->
    <circle cx="256" cy="256" r="176" stroke="#ffffff" stroke-opacity="0.07" stroke-width="34"/>
    <circle cx="256" cy="256" r="128" stroke="#ffffff" stroke-opacity="0.07" stroke-width="34"/>
    <circle cx="256" cy="256" r="80"  stroke="#ffffff" stroke-opacity="0.07" stroke-width="34"/>
    <!-- ความคืบหน้า: อาหาร / ออกกำลัง / นอน -->
    <g filter="url(#glow)" stroke-width="34">
      <circle cx="256" cy="256" r="176" stroke="url(#g1)"
              stroke-dasharray="862 244" pathLength="1106"/>
      <circle cx="256" cy="256" r="128" stroke="url(#g2)"
              stroke-dasharray="499 305" pathLength="804"/>
      <circle cx="256" cy="256" r="80"  stroke="url(#g3)"
              stroke-dasharray="226 277" pathLength="503"/>
    </g>
  </g>
</svg>
